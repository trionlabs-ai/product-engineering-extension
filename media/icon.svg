<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Radial Glow Behind Emblem -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Prism Top Face -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Prism Left Face -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Prism Right Face -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Core Sparkle Glow -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <!-- Secondary Star Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="url(#glowGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Isometric Product Studio Prism / Emblem -->
  <g filter="url(#dropShadow)">
    <!-- Top Diamond Face -->
    <polygon points="256,112 364,174 256,236 148,174" fill="url(#topFace)"/>
    <!-- Highlight on top edge -->
    <polyline points="148,174 256,112 364,174" fill="none" stroke="#f3e8ff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Left Face -->
    <polygon points="148,174 256,236 256,368 148,306" fill="url(#leftFace)"/>
    <!-- Left outer accent line -->
    <line x1="148" y1="174" x2="148" y2="306" stroke="#818cf8" stroke-width="2" opacity="0.6"/>

    <!-- Right Face -->
    <polygon points="256,236 364,174 364,306 256,368" fill="url(#rightFace)"/>
    <!-- Right outer accent line -->
    <line x1="364" y1="174" x2="364" y2="306" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

    <!-- Center vertical seam line -->
    <line x1="256" y1="236" x2="256" y2="368" stroke="#ffffff" stroke-width="2" opacity="0.35"/>
  </g>

  <!-- Dynamic Orbiting Layer / Studio Ring (representing flow from Ticket to Delivery) -->
  <path d="M 116 270 C 116 340, 396 340, 396 270 C 396 230, 340 205, 290 200" fill="none" stroke="url(#borderGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 10" opacity="0.8"/>
  <circle cx="396" cy="270" r="6" fill="#38bdf8" filter="url(#glowFilter)"/>

  <!-- Central AI Core Sparkle (Google DeepMind / Modern AI 4-Point Star) -->
  <g transform="translate(256, 236)" filter="url(#glowFilter)">
    <circle cx="0" cy="0" r="28" fill="url(#starGlow)"/>
    <!-- Sparkle shape -->
    <path d="M 0,-34 C 1.5,-10 10,-1.5 34,0 C 10,1.5 1.5,10 0,34 C -1.5,10 -10,1.5 -34,0 C -10,-1.5 -1.5,-10 0,-34 Z" fill="url(#sparkleGrad)"/>
    <circle cx="0" cy="0" r="4.5" fill="#ffffff"/>
  </g>

  <!-- Accent mini sparkles -->
  <g transform="translate(376, 140)">
    <path d="M 0,-14 C 0.8,-4 4,-0.8 14,0 C 4,0.8 0.8,4 0,14 C -0.8,4 -4,0.8 -14,0 C -4,-0.8 -0.8,-4 0,-14 Z" fill="#38bdf8" opacity="0.9"/>
  </g>
  <g transform="translate(136, 320)">
    <path d="M 0,-10 C 0.5,-3 3,-0.5 10,0 C 3,0.5 0.5,3 0,10 C -0.5,3 -3,0.5 -10,0 C -3,-0.5 -0.5,-3 0,-10 Z" fill="#c084fc" opacity="0.85"/>
  </g>
</svg>
